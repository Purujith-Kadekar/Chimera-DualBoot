; ============================================================================
; EdgeHax Launcher -- dual-boot menu for the EdgeHax S3 Pro (ESP32-S3 N16R8)
;
; This is the 3rd firmware. It lives in the FACTORY partition, so it is what
; the bootloader starts on every power-up / reset. It lets you pick between
; SecureVault (ota_0) and ShadowTune (ota_1). The two apps are NOT modified;
; their own .bin files are simply flashed into ota_0 / ota_1.
;
; Toolchain settings below deliberately mirror your two existing projects
; (same pioarduino platform, same dual-framework mode) so nothing new has to
; work. See README.md for flashing instructions.
; ============================================================================

[env:edgehax-launcher]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1

; Dual-framework (Arduino + ESP-IDF) so sdkconfig.defaults controls the
; bootloader. The launcher NEEDS bootloader app-rollback support (see
; sdkconfig.defaults) -- that is the trick that brings the menu back on every
; boot without touching the two apps.
framework = arduino, espidf

extra_scripts =
    pre:force_clean_cache.py
    pre:disable_component_manager.py

board_build.esp-idf.sdkconfig_defaults = sdkconfig.defaults

; ---- 16 MB flash, same modes as the other two projects ----
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

; ---- Shared partition table: launcher + both apps (see partitions.csv) ----
board_build.partitions = partitions.csv

; USB-C serial log (native USB Serial/JTAG), same as SecureVault.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_compat_mode = strict
lib_ldf_mode = chain

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ILI9341 @ ^1.6.1
