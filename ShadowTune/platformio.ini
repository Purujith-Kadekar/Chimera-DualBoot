; MP3 Player firmware — PlatformIO build configuration
; Forked from SecureVault — removed BLE/NimBLE/ArduinoJson/ESPAsyncWebServer,
; added WebServer for hotspot mode, kept Adafruit GFX/ILI9341 and QRCode.

[env:esp32-s3-devkitc-1]
; pioarduino platform — properly pairs Arduino 3.x with a current IDF
; release for dual-framework builds (same fix as SecureVault).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
; Dual-framework mode — needed for WiFi hotspot (esp_wifi/esp_netif APIs)
; while keeping Arduino's setup()/loop() for everything else.
framework = arduino, espidf


; Disable ESP-IDF component manager — vendored components in components/
; are auto-discovered by PlatformIO without needing the online resolver.
extra_scripts =
    pre:force_clean_cache.py
    pre:disable_component_manager.py

; ESP-IDF sdkconfig defaults (dual-framework mode needs this)
board_build.esp-idf.sdkconfig_defaults = sdkconfig.defaults

; Flash size & partitions
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; PSRAM (8MB OPI)
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

; USB-OTG mode — required for USB MSC (flash drive) feature.
;
; CONFIG_TINYUSB_ENABLED: not a real Kconfig symbol in this project's
; vendored components/esp_tinyusb or components/tinyusb trees (grepping
; both for "config TINYUSB_ENABLED" finds nothing), so sdkconfig.defaults
; entries for it are silently dropped. But arduino-esp32's own
; cores/esp32/esp32-hal-tinyusb.h wraps its entire TinyUSB include chain
; (tusb.h, tusb_config.h, etc. -- where CFG_TUD_CDC, TU_VERIFY,
; TUD_CDC_DESC_LEN and the rest of the "was not declared" errors come
; from) in `#if CONFIG_TINYUSB_ENABLED`, so it must be defined directly
; as a compiler flag instead.
;
; ARDUINO_USB_MODE=0: selects the ESP32-S3's USB-OTG/TinyUSB peripheral
; instead of the fixed-function USB-Serial/JTAG one that the
; esp32-s3-devkitc-1 board manifest defaults to (ARDUINO_USB_MODE=1).
; USBMSC (USB flash-drive mode) only works over the OTG peripheral --
; Arduino's own USBMSC.ino example explicitly #warnings that it can't
; run under ARDUINO_USB_MODE==1 at all. build_unflags removes the
; manifest's default value first since it's otherwise defined twice.
build_unflags =
    -DARDUINO_USB_MODE=1

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_TINYUSB_ENABLED=1
    -DARDUINO_USB_MODE=0
    -Iinclude
    ; Fix for "esp_littlefs.h: No such file or directory" — adds the
    ; vendored esp_littlefs component's public include dir globally.
    -Icomponents/esp_littlefs/include
    ; Fix for "littlefs/lfs.h: No such file or directory" — adds the
    ; vendored esp_littlefs component's private include dir for the
    ; nested littlefs submodule headers.
    -Icomponents/esp_littlefs/src
    ; Helix MP3 decoder component — provides mp3_decoder.h
    -Icomponents/helix_mp3/include
    ; TinyUSB public headers — needed by Arduino-ESP32's USB.h/USBMSC.h
    ; wrapper classes at compile time (tusb.h, tusb_config.h, etc.).
    -Icomponents/esp_tinyusb/include
    -Icomponents/tinyusb/src

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; Library dependencies
; Adafruit GFX/ILI9341 for the SPI TFT display
; QRCode for WiFi QR code generation
; WebServer (bundled with Arduino-ESP32 core) for hotspot AP mode
; ArduinoJson for the dashboard serial protocol (JSON handshake + LIST/GET/ADD payloads)
; NOTE: WiFi, DNSServer, ESPmDNS are bundled with the Arduino-ESP32
; core — no lib_deps entry needed for those.
lib_compat_mode = strict
lib_ldf_mode = chain

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ILI9341 @ ^1.6.1
    ricmoo/QRCode @ ^0.0.1
    bblanchon/ArduinoJson @ ^7.1.0

; ---- NOTE on XPT2046 touch ----
; display_manager.cpp bit-bangs the XPT2046 directly on T_DO (GPIO41),
; matching the confirmed-working reference implementation -- no touch
; controller library needed.
